# fly.toml app configuration file generated for base-tx-explain on 2026-08-20T00:49:56-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'base-tx-explain'
primary_region = 'iad'

# SHUTDOWN CONTRACT. Both values are load-bearing and were both absent, which is
# why a deploy killed in-flight paid requests outright.
#
# kill_signal: pinned to what Fly ACTUALLY sends rather than left to a default —
# verified in our own logs (3x "Sending signal SIGINT to main child process",
# zero SIGTERM). src/index.ts handles both, but stating it here means a future
# change to Fly's default cannot silently move it out from under us.
#
# kill_timeout: the default is FIVE SECONDS to SIGKILL. An x402 settle involves
# an on-chain broadcast and exceeds that, so a drain handler under the default
# would look correct and still be shot mid-settle. 30s comfortably covers a
# settle; the in-process grace is 25s so we exit on our own terms first.
kill_signal = 'SIGINT'
kill_timeout = '30s'
# MIRRORED as KILL_TIMEOUT_MS under [env] below, because the process cannot read
# its own kill_timeout and derives the drain grace from it (kill_timeout - 5s).
# TOML puts these in different sections so they CANNOT sit adjacent, which is
# exactly the two-place invariant that decays — so it is enforced rather than
# described: scripts/predeploy.sh refuses to deploy if the two disagree.

[build]
[env]
  # Must equal kill_timeout above, in ms. Enforced by scripts/predeploy.sh.
  KILL_TIMEOUT_MS = '30000'
  BASE_RPC_URLS = 'https://mainnet.base.org,https://base-rpc.publicnode.com,https://base.llamarpc.com'
  DATA_DIR = '/data'
  FREE_CALLS_PER_IP = '10'
  PAYMENT_MODE = 'x402'
  X402_FACILITATOR_URL = 'https://facilitator.payai.network'
  X402_PAY_TO = '0xd4ec730ab062f20460727710fce70664948a6bc9'
  X402_PRICE_USD = '0.02'

# One machine, one volume: the usage ledger is a single-writer append log.
[mounts]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

# HEALTH CHECK. There was none until 2026-08-22, which left one failure mode
# entirely uncovered: a CRASH gets restarted by Fly, but a HANG — process alive,
# not answering — was never noticed and never restarted. `auto_start_machines`
# only revives a stopped machine, not a wedged one, so a hung process stayed
# hung until a human happened to look. The only watch was an agent remembering
# to run a loop.
#
# WHY /healthz IS SAFE TO CHECK, which is the load-bearing property: it returns
# a hardcoded 200 and makes NO network calls — no RPC, no Blockscout, no Stripe,
# no facilitator. A degraded payment path is reported as `payments_ready: false`
# in the BODY, never as a non-200. So no upstream outage can fail this check,
# and no third party can restart our machine by having a bad day. It fails only
# if the process is wedged or dead, which is exactly what it is for.
#
# NUMBERS CHOSEN AGAINST A MEASUREMENT, not a guess. Boot to /healthz answering
# is 0.43–0.93s across three runs with the real ledger replayed, so a 30s grace
# is roughly 30x the slowest observed — room for a cold image pull without ever
# shooting a machine that is merely still starting.
#
# DELIBERATELY LENIENT, because the two failure directions are not symmetric. Too
# aggressive means restart loops, and every restart kills whatever paid request
# is in flight — the exact loss the drain was built to prevent, inflicted
# repeatedly by our own monitoring. Too lenient only means a hang is noticed a
# little later. A 10s timeout on an endpoint that answers in milliseconds is
# generous on purpose: it tolerates a GC pause on a 256MB box rather than
# calling it death.
#
# A check-driven restart goes through the normal stop path, so `kill_signal` and
# `kill_timeout` above apply and in-flight requests still drain.
[[http_service.checks]]
  grace_period = '30s'
  interval = '15s'
  timeout = '10s'
  method = 'GET'
  path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
